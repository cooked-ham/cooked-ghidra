import groovy.xml.DOMBuilder

apply plugin: 'eclipse'
eclipse.project {
  name = '_Decompiler'
  buildCommand 'org.eclipse.cdt.managedbuilder.core.genmakebuilder'
  buildCommand 'org.eclipse.cdt.managedbuilder.core.ScannerConfigBuilder'
  natures 'org.eclipse.cdt.core.cnature'
  natures 'org.eclipse.cdt.core.ccnature'
  natures 'org.eclipse.cdt.managedbuilder.core.managedBuildNature'
  natures 'org.eclipse.cdt.managedbuilder.core.ScannerConfigNature'
}

// The withXml hook on Eclipse file generation tasks is deprecated. Add the CDT build triggers
// after the .project file has been generated instead.
tasks.named('eclipseProject') {
  doLast {
    File projectFile = file('.project')
    def document = DOMBuilder.parse(new FileReader(projectFile), false, true, true)
    def buildCommands = document.getElementsByTagName('buildCommand')
    for (int i = 0; i < buildCommands.length; i++) {
      def buildCommand = buildCommands.item(i)
      String name = buildCommand.getElementsByTagName('name').item(0).textContent
      def triggers = buildCommand.getElementsByTagName('triggers')
      while (triggers.length > 0) {
        buildCommand.removeChild(triggers.item(0))
      }
      String triggerValue = null
      if (name.contains('genmakebuilder')) {
        triggerValue = 'clean,full,incremental'
      }
      else if (name.contains('ScannerConfigBuilder')) {
        triggerValue = 'full,incremental'
      }
      if (triggerValue != null) {
        def triggersNode = document.createElement('triggers')
        triggersNode.textContent = triggerValue
        buildCommand.appendChild(triggersNode)
      }
    }
    def transformer = javax.xml.transform.TransformerFactory.newInstance().newTransformer()
    transformer.transform(new javax.xml.transform.dom.DOMSource(document),
      new javax.xml.transform.stream.StreamResult(projectFile))
  }
}
