<text x="68" y="901" font-size="17" >Copper / #CB9474 · chrome gradient / #44372D → #2B2723</text>
<text x="68" y="931" font-size="16" class="muted">Expressive depth belongs in headers, toolbar groups and overlays. Code and hex stay flat.</text>
<text x="48" y="1008" font-size="24" >Typography and geometry</text>
<text x="48" y="1042" font-size="17" >Segoe UI Variable Text → Segoe UI → logical SansSerif · 13 pt controls</text>
<text x="48" y="1074" font-size="17" class="mono">Cascadia Mono → JetBrains Mono → Consolas → Monospaced · 13 pt code</text>
<text x="48" y="1106" font-size="17" >Spacing 4 / 8 / 12 / 16 / 24 · chrome radius 8–10 · compact rows 18 / standard rows 22</text>
<text x="48" y="1150" font-size="16" class="muted">Brand amber is paired with labels; warnings use a triangle, errors use !, and keyboard focus uses cyan.</text>
<text x="48" y="1180" font-size="15" class="muted">State samples and gradient are design specifications; live screenshots show current implementation fidelity.</text>
